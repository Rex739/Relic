[project]
name = "RelicYieldScout-agent"
display_name = "Relic Yield Scout"

[stack]
# Project-lifetime facts: which framework / runtime adapter recipes this
# Agent was scaffolded against. doctor / dev / deploy read these to know
# what to check, load, and route. framework: adk; runtime: agentcore | azure-foundry.
runtime = "agentcore"
# External protocol this runtime serves (one runtime, one signer):
#   A2A — serve_a2a: agent card + negotiate/notify_funded skills.
#   MCP — FastMCP on /mcp: negotiate (signed quote) + notify_funded (verify →
#         deliver → submit, synchronously within the tool call) + read-only chain
#         tools. MCP delivery runs in-call (≤ ~15 min); the runtime is stateful.
protocols = ["A2A"]

[network]
default = "bsc-testnet"

[deploy]
# No managed-platform destination is set. `bag deploy --provider aws` deploys
# this AgentCore runtime into the operator-owned AWS account without the BNB
# managed platform's 48-hour trial expiry.
iam_notice_accepted_at = "2026-08-29T15:37:25Z"
iam_notice_version = 1
last_deploy_at = "2026-08-29T19:59:57Z"
provider = "aws"
runtime_arn = "arn:aws:bedrock-agentcore:us-east-1:699289398114:runtime/RelicYieldScout-Aby9v32xja"
invoke_url = "https://bedrock-agentcore.us-east-1.amazonaws.com/runtimes/arn%3Aaws%3Abedrock-agentcore%3Aus-east-1%3A699289398114%3Aruntime%2FRelicYieldScout-Aby9v32xja/invocations?qualifier=DEFAULT"
oauth_client_id = "5l1tc2g39911prqdt5os8ak87"
oauth_discovery_url = "https://cognito-idp.us-east-1.amazonaws.com/us-east-1_kM2SHi2Qz/.well-known/openid-configuration"
packaging = "codezip"

[wallet]
# Local keystore signer. The Agent is the SOLE key-holder/signer.
# The keystore lives at the WORKSPACE root — outside app/agent (the AgentCore
# codeLocation) — so no packaging path can bundle it into a deploy artifact.
kind = "evm-local"
signer = "local"
keystore_dir = "../../.studio/wallets"
# address = "0x..."   # filled by `bag wallet new`
address = "0xe41980d16fCf1d55f7C5308D5217DFFac97C9c19"

# Relic Yield Scout is deterministic and performs read-only Venus RPC calls.
# It does not use an LLM or require an LLM provider credential.

[payments.erc8183]
# Read by the Agent: it quotes the FIXED `price`, CLAMPS it to [min,max],
# freezes a short-TTL offer, and EIP-191 signs it — pricing is rule-based, the
# LLM never prices.
currency = "0xc70B8741B8B07A6d61E54fd4B20f22Fa648E5565"   # $U token address — prefilled from [network].default
price = "1000000000"                           # v1 minimum: 1 gwei in token base units
min_price = "1000000000"                       # fixed-price clamp floor
max_price = "1000000000"                       # fixed-price clamp ceiling
quote_ttl_seconds = 900                        # seconds a signed quote stays valid; SDK caps at 900 (~15min work window)
default_estimated_completion_seconds = 600
poll_interval_seconds = 30
auto_settle = false                            # opt-in: detect dispute-window-elapsed → settle

[storage]
# Durable public delivery storage. The operator must configure
# STORAGE_API_URL and, where required, STORAGE_API_KEY before deployment.
kind = "ipfs"


[payments.x402]
# Optional: PIN the trusted Pieverse pay-to address. Leave empty — `bag llm
# topup` / auto-topup auto-discover it from the hardcoded, SIWE-authenticated
# topup endpoint (validated chain + U asset). Set a value only to pin a
# specific recipient; the generic x402 buyer still never trusts an un-pinned
# payTo from an arbitrary URL.
expected_recipient = ""
allowed_hosts = ["llm.pieverse.io"]

[budget]
# auto-topup consent — `acknowledged_at` is the ISO-8601 UTC
# timestamp marking when the user explicitly accepted the auto-topup terms.
# Both `enabled = true` AND a valid `acknowledged_at` are required for the
# in-process auto-topup hook to fire (defends against hand-edits).
enabled = false
acknowledged_at = "2026-08-28T15:50:05Z"
# Caps — tighten/loosen via `bag budget enable --max-per-topup-usd N ...`
max_per_topup_usd = 1.0
max_per_day_usd = 3.0
max_per_month_usd = 15.0

[identity]
endpoint = "https://bedrock-agentcore.us-east-1.amazonaws.com/runtimes/arn%3Aaws%3Abedrock-agentcore%3Aus-east-1%3A699289398114%3Aruntime%2FRelicYieldScout-Aby9v32xja/invocations?qualifier=DEFAULT"
registered_at = "2026-08-29T16:32:49.331Z"
agent_id = 2016
